<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Assistant 🔊</title>
</head>
<body>
  <h2>🎙️ Speak to Your Assistant</h2>
  <button onclick="startRecording()">Start Talking</button>
  <button onclick="stopRecording()">Stop</button>
  <audio id="responsePlayer" controls></audio>

  <script>
    let socket;
    let audioContext;
    let sourceNode;
    let processorNode;
    let isRecording = false;
    const BUFFER_SIZE = 8192;
    const SAMPLE_RATE = 16000;

    async function startRecording() {
      if (isRecording) return;
      isRecording = true;

      try {
        socket = new WebSocket("ws://localhost:8765/ws");
        
        socket.onmessage = function (event) {
          const audioBlob = new Blob([event.data], { type: 'audio/mpeg' });
          const audioUrl = URL.createObjectURL(audioBlob);
          document.getElementById("responsePlayer").src = audioUrl;
          document.getElementById("responsePlayer").play();
        };

        socket.onerror = function(error) {
          console.error('WebSocket Error:', error);
          stopRecording();
        };

        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            channelCount: 1,
            sampleRate: SAMPLE_RATE,
            sampleSize: 16,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        audioContext = new AudioContext({
          sampleRate: SAMPLE_RATE,
          channelCount: 1
        });
        
        sourceNode = audioContext.createMediaStreamSource(stream);
        
        // Create a worklet for consistent audio processing
        await audioContext.audioWorklet.addModule('data:text/javascript;base64,' + btoa(`
          class AudioProcessor extends AudioWorkletProcessor {
            constructor() {
              super();
              this.buffer = new Float32Array(${BUFFER_SIZE});
              this.bufferIndex = 0;
            }

            process(inputs, outputs, parameters) {
              const input = inputs[0][0];
              
              for (let i = 0; i < input.length; i++) {
                this.buffer[this.bufferIndex++] = input[i];
                
                if (this.bufferIndex >= ${BUFFER_SIZE}) {
                  // Convert to 16-bit PCM
                  const pcmData = new Int16Array(${BUFFER_SIZE});
                  for (let j = 0; j < ${BUFFER_SIZE}; j++) {
                    pcmData[j] = Math.max(-1, Math.min(1, this.buffer[j])) * 0x7FFF;
                  }
                  
                  this.port.postMessage(pcmData.buffer);
                  this.bufferIndex = 0;
                }
              }
              return true;
            }
          }
          registerProcessor('audio-processor', AudioProcessor);
        `));

        const worklet = new AudioWorkletNode(audioContext, 'audio-processor');
        worklet.port.onmessage = (e) => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(e.data);
          }
        };

        sourceNode.connect(worklet);
        worklet.connect(audioContext.destination);

      } catch (error) {
        console.error('Error starting recording:', error);
        stopRecording();
      }
    }

    function stopRecording() {
      isRecording = false;
      
      if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
      }
      
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      
      if (socket) {
        socket.close();
        socket = null;
      }
    }
  </script>
</body>
</html>
